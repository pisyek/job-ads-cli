name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PHP_VERSION: '8.5'

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Detect the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check that every file parses
        run: |
          php -l bin/jobs
          find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check the code style
        run: composer lint

      - name: Run static analysis
        run: composer analyse

      - name: Run the tests
        run: composer test

      - name: Smoke test the CLI
        run: |
          php bin/jobs list
          php bin/jobs filter --skill=laravel --min-salary=5000
          php bin/jobs stats
